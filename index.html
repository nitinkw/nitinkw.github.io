<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solaris Consulting Service, Inc.</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1a1f2b; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#1a2030; --text:#eef1f7; --accent:#60a5fa; }
  }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:var(--bg); color:var(--text);
         font-family:system-ui,sans-serif; }
  .card { background:var(--card); width:min(92%,380px); padding:32px 24px;
          border-radius:16px; text-align:center;
          box-shadow:0 8px 30px rgba(0,0,0,.12); }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .tag { color:var(--accent); font-weight:600; margin-bottom:20px; }
  .name { font-size:1.1rem; margin-bottom:24px; }
  a.btn { display:block; margin:10px 0; padding:14px; border-radius:10px;
          text-decoration:none; font-weight:600;
          border:2px solid var(--accent); color:var(--accent); }
  a.primary { background:var(--accent); color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Solaris Consulting Service, Inc.</h1>
    <div class="tag">AI and Digital Solutions</div>
    <div class="name">Nitin Warekar</div>
    <a class="btn primary" href="contact.vcf">Save Contact</a>
    <a class="btn" href="tel:+19043158450">Call +1 904 315 8450</a>
    <!-- <a class="btn" href="https://www.yourwebsite.com">Visit Website</a> -->
  </div>
</body>
</html>
